[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tugboat"
description = "A governance layer for teams that build with AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
dynamic = ["version"]

[project.scripts]
tug = "tugboat.cli:main"

[tool.setuptools.dynamic]
version = { attr = "tugboat.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
