name: Secret scan

# The CI secret scan of this project. A project turns it on in its profile: `tug init --ci secret-scan`.
# Each app repo then gets a short workflow from `tug init` that calls this one for every pull request.
# The scanner is gitleaks, an open-source program (MIT licence). A finding fails the check.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: Scan the pull request for secrets
    runs-on: ubuntu-latest
    env:
      # To move to a newer gitleaks, change both lines. The second is the SHA-256 of the linux_x64 archive,
      # from the checksums file of that release.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get gitleaks, and check that it is the file that was published
        run: |
          curl --silent --show-error --fail --location --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar --extract --gzip --file gitleaks.tar.gz --directory "${RUNNER_TEMP}/gitleaks" gitleaks
          rm gitleaks.tar.gz
      - name: Scan the commits of this pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "${BASE}" ] || [ -z "${HEAD}" ]; then
            echo "This workflow scans the commits of a pull request. It was started by something else, so it has nothing to scan."
            exit 1
          fi
          # --redact keeps a found secret out of the log. The exit code is 1 when something is found.
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --redact --no-banner --verbose --log-opts="${BASE}..${HEAD}"
